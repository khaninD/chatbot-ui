version: "3.8"

services:
  chatbot-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-ui
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Client-side Supabase (browser uses localhost:8000)
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      # Server-side Supabase (Next.js server uses host.docker.internal:8000)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      # LlamaIndex Agent URL
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      # - chatbot-network
      - premium-gpt-network

networks:
  # chatbot-network:
  #   driver: bridge
  premium-gpt-network:
    external: true
